version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: urbanlens
      POSTGRES_PASSWORD: urbanlens
      POSTGRES_DB: urbanlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanlens"]
      interval: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://urbanlens:urbanlens@db:5432/urbanlens
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC: urbanlens/ingest
      RUN_MQTT_WORKER: "1"
      API_TOKEN: sih-demo-token
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

volumes:
  pgdata:
